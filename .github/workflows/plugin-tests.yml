  python-39-vendor-compatibility:
    name: Release ZIP - Python 3.9 browser branch
    needs: test
    if: needs.test.outputs.substantive_changes == 'true'
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Set up the actual Python 3.9 runtime
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.9.25"

    - name: Download the exact release ZIPs
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
      with:
        name: release-zips
        path: dist

    - name: Locate downloaded release ZIPs
      shell: pwsh
      run: |
        $romanceio = Get-ChildItem -Path dist -Recurse -Filter 'Romance.io.zip' | Select-Object -First 1
        $fields = Get-ChildItem -Path dist -Recurse -Filter 'Romance.io Fields.zip' | Select-Object -First 1
        if (-not $romanceio -or -not $fields) {
          throw 'Both release ZIPs must be present in the downloaded artifact.'
        }
        "ROMANCEIO_ZIP=$($romanceio.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "ROMANCEIO_FIELDS_ZIP=$($fields.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Import the Python 3.9 vendored browser stack
      run: |
        python -m pip install lxml==6.0.2 psutil==7.1.3
        python -c "import sys; assert sys.version_info[:2] == (3, 9), sys.version"
        python common/test_release_zip_imports.py "$ROMANCEIO_ZIP"
        python common/test_release_zip_imports.py "$ROMANCEIO_FIELDS_ZIP"

  calibre-5-desktop-compatibility:
    name: Installed ZIP - Calibre 5.44 on ${{ matrix.name }}
    needs: test
    if: needs.test.outputs.substantive_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025
          - name: macOS Apple Silicon
            os: macos-15
            architecture: arm64
          - name: macOS Intel
            os: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Download the exact release ZIPs
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
      with:
        name: release-zips
        path: dist

    - name: Locate downloaded release ZIPs
      shell: pwsh
      run: |
        $romanceio = Get-ChildItem -Path dist -Recurse -Filter 'Romance.io.zip' | Select-Object -First 1
        $fields = Get-ChildItem -Path dist -Recurse -Filter 'Romance.io Fields.zip' | Select-Object -First 1
        if (-not $romanceio -or -not $fields) {
          throw 'Both release ZIPs must be present in the downloaded artifact.'
        }
        "ROMANCEIO_ZIP=$($romanceio.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "ROMANCEIO_FIELDS_ZIP=$($fields.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "CALIBRE_CONFIG_DIRECTORY=$env:RUNNER_TEMP/calibre-5-desktop-config" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Install verified Calibre 5.44 on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $installer = Join-Path $env:RUNNER_TEMP "calibre-64bit-$env:CALIBRE_5_DESKTOP_VERSION.msi"
        $url = "https://download.calibre-ebook.com/$env:CALIBRE_5_DESKTOP_VERSION/calibre-64bit-$env:CALIBRE_5_DESKTOP_VERSION.msi"
        Invoke-WebRequest -Uri $url -OutFile $installer
        python common/verify_sha512.py $installer $env:CALIBRE_5_WINDOWS_SHA512
        $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/i', $installer, '/qn', '/norestart')
        if ($process.ExitCode -notin @(0, 3010)) {
          throw "Calibre 5.44 MSI installation failed with exit code $($process.ExitCode)"
        }
        'C:\Program Files\Calibre2' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        & 'C:\Program Files\Calibre2\calibre-debug.exe' --version

    - name: Install verified Calibre 5.44 on macOS
      if: runner.os == 'macOS'
      run: |
        test "$(uname -m)" = "${{ matrix.architecture }}"
        curl -fsSL \
          "https://download.calibre-ebook.com/$CALIBRE_5_DESKTOP_VERSION/calibre-$CALIBRE_5_DESKTOP_VERSION.dmg" \
          -o "$RUNNER_TEMP/calibre-5.dmg"
        python3 common/verify_sha512.py "$RUNNER_TEMP/calibre-5.dmg" "$CALIBRE_5_MACOS_SHA512"
        mkdir -p "$RUNNER_TEMP/calibre-5-dmg"
        hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/calibre-5-dmg" "$RUNNER_TEMP/calibre-5.dmg"
        CALIBRE_APP=$(find "$RUNNER_TEMP/calibre-5-dmg" -maxdepth 1 -name '*.app' -print -quit)
        test -n "$CALIBRE_APP"
        ditto "$CALIBRE_APP" "$RUNNER_TEMP/calibre-5.app"
        hdiutil detach "$RUNNER_TEMP/calibre-5-dmg"
        echo "$RUNNER_TEMP/calibre-5.app/Contents/MacOS" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/calibre-5.app/Contents/MacOS/calibre-debug" --version

    - name: Install and verify exact release ZIPs on Calibre 5.44
      shell: pwsh
      run: |
        calibre-customize -a "$env:ROMANCEIO_ZIP"
        calibre-customize -a "$env:ROMANCEIO_FIELDS_ZIP"
        calibre-debug -e common/test_release_zip_imports.py -- "$env:ROMANCEIO_ZIP"
        calibre-debug -e common/test_release_zip_imports.py -- "$env:ROMANCEIO_FIELDS_ZIP"
        calibre-debug -e common/test_installed_plugins.py

    - name: Required local Chrome launch on Calibre 5.44
      timeout-minutes: 5
      shell: pwsh
      run: calibre-debug -e common/run_installed_browser_smoke.py -- romanceio_fields

