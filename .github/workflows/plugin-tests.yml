name: Calibre Plugin Tests

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]  # Only run on main; feature branches are covered by pull_request
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 12 * * *"  # Run daily at 4am PST (12pm UTC)

permissions:
  contents: read
  actions: read  # Needed to query previous workflow run status

env:
  # Keep one current Calibre version across Linux, Windows, and macOS so the
  # compatibility matrix tests the same application release everywhere.
  # Digests are pinned from https://calibre-ebook.com/signatures/.
  CALIBRE_CURRENT_VERSION: "9.14.0"
  CALIBRE_CURRENT_LINUX_SHA512: "d1a162d472dfbc3b74946809a979197121277150efe9e2172786843573c89dab542ce2bad98164c5d788420d2b9d8caea208cfe82c5016b3db09c0ed3ef3fc37"
  CALIBRE_CURRENT_LINUX_ARM64_SHA512: "4f20dd31065f09a2777c1a2815acce2d6fabc0c9b48d41b4c909e245bf53e7b03dfdcbaa362095cbfb3bc840113244e261b6d07a4bbd4911b3dbdad665c2fd7e"
  CALIBRE_CURRENT_WINDOWS_SHA512: "e2c1417ee4801fff87a1e10f4014e6e20a0b4efa1169417d1942b4352d4901fcb410bfab4a55bfb7f22737b64ff8956d508898a7fa7734e08f9d8a96391bc8d1"
  CALIBRE_CURRENT_MACOS_SHA512: "b88c240f61c06ea311472419403681d914784d60f3a8e4391f65786feb49a7f2cb268dfff7b31b2e1a9e137d62efc8f3ef04d392f3ba44b56dce2199dd7708dd"
  CALIBRE_5_LINUX_SHA512: "4dc7907af940851e966c20d6b5c0e95da5097d54d5b0d774d7a9c5ff4fbeeee5a0fc07e08c78a70522790e904a5d70af159661463bfb8e29389e6d9b25f4851f"
  CALIBRE_5_DESKTOP_VERSION: "5.44.0"
  CALIBRE_5_WINDOWS_SHA512: "c0f9c67a83d3d51fc99cc896dded0d682d083a42dd596dbe9ac3401ad036b9af981573a5febea23f5d8758dd69db49caa7ea23c85bc0392fa1d000e2c291bfda"
  CALIBRE_5_MACOS_SHA512: "ff115bd5f7b434b892c298039cb2f244108cbfcf1e09b7ec18ac323a13a40fbce9b06d47d0c9c5c8386b864fb1a6f0bbd7c5dd3dd1856c7c81f2c19e781057db"

jobs:
  test:
    runs-on: ubuntu-24.04
    outputs:
      substantive_changes: ${{ steps.changes.outputs.substantive_changes }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        fetch-depth: 2  # Fetch at least 2 commits for diff comparison

    - name: Configure isolated Calibre paths
      run: |
        echo "CALIBRE_CONFIG_DIRECTORY=$RUNNER_TEMP/calibre-config" >> "$GITHUB_ENV"
        echo "CALIBRE_DIRECTORY=$RUNNER_TEMP/calibre-current" >> "$GITHUB_ENV"

    - name: Detect changes and determine what to run
      id: changes
      run: |
        # Check if previous workflow run failed (to catch lingering test failures)
        FORCE_ALL_TESTS=false
        if [ "${{ github.event_name }}" != "schedule" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
          echo "Checking previous workflow run status..."

          # Get the most recent completed workflow run before this one
          PREV_CONCLUSION=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/actions/workflows/plugin-tests.yml/runs?per_page=5&branch=${{ github.ref_name }}&status=completed" \
            --jq ".workflow_runs | map(select(.id != ${{ github.run_id }})) | .[0].conclusion // \"none\"" 2>/dev/null || echo "none")

          echo "Previous run conclusion: $PREV_CONCLUSION"

          if [ "$PREV_CONCLUSION" != "success" ] && [ "$PREV_CONCLUSION" != "none" ]; then
            echo "⚠️  Previous workflow run did not succeed (conclusion: $PREV_CONCLUSION)"
            echo "🔄 Forcing all tests to run to catch any persisting failures"
            FORCE_ALL_TESTS=true
          fi
        fi

        # Determine which files changed
        if [ "${{ github.event_name }}" == "schedule" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          # For scheduled and manually dispatched runs, run all tests
          echo "Scheduled/manual run - will run all tests"
          CHANGED_FILES="all"
        elif [ "${{ github.event_name }}" == "pull_request" ]; then
          # For PRs, compare against the base branch
          git fetch origin ${{ github.base_ref }} 2>/dev/null || true
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null || echo "all")
        else
          # For pushes, compare against the state before this push (handles multiple commits)
          if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            # Fetch the before commit if not already available
            git fetch origin ${{ github.event.before }} 2>/dev/null || true
            CHANGED_FILES=$(git diff --name-only ${{ github.event.before }}..HEAD 2>/dev/null || echo "all")
          else
            # First commit in a new branch, run all tests
            CHANGED_FILES="all"
          fi
        fi

        echo "Changed files:"
        echo "$CHANGED_FILES"

        # Check if changes are substantive (not just documentation)
        # Non-substantive files: *.md, LICENSE, .gitignore, and non-requirement *.txt files
        if [ "$CHANGED_FILES" == "all" ]; then
          echo "substantive_changes=true" >> $GITHUB_OUTPUT
          echo "✅ First commit or unable to determine changes - running full pipeline"
        elif echo "$CHANGED_FILES" | grep -qE '(^|/)requirements[^/]*\.txt$'; then
          # Every root/plugin dependency manifest is substantive
          echo "substantive_changes=true" >> $GITHUB_OUTPUT
          echo "✅ Substantive changes detected (including a dependency manifest)"
        elif echo "$CHANGED_FILES" | grep -v -E '\.(md)$|^LICENSE$|^\\.gitignore$|\\.txt$|^images/' | grep -q .; then
          # Has files other than markdown, LICENSE, .gitignore, .txt, images/
          echo "substantive_changes=true" >> $GITHUB_OUTPUT
          echo "✅ Substantive changes detected (code, tests, or config files)"
        else
          # Only non-substantive files changed
          echo "substantive_changes=false" >> $GITHUB_OUTPUT
          echo "romanceio_changed=false" >> $GITHUB_OUTPUT
          echo "romanceio_fields_changed=false" >> $GITHUB_OUTPUT
          echo "core_changed=false" >> $GITHUB_OUTPUT
          echo "⏭️  Only documentation files changed - skipping pipeline"
          exit 0
        fi

        # Check if core/shared files changed (anything except plugin folders and certain root files)
        # Run all tests if:
        # - Previous run failed (FORCE_ALL_TESTS=true)
        # - Scheduled run or first commit (CHANGED_FILES="all")
        # - Changes are in core directories that affect all plugins
        if [ "$FORCE_ALL_TESTS" == "true" ] || [ "$CHANGED_FILES" == "all" ] || echo "$CHANGED_FILES" | grep -v -E "^(romanceio/|romanceio_fields/|LICENSE|README\.md)$|^(romanceio/|romanceio_fields/)" | grep -q .; then
          echo "core_changed=true" >> $GITHUB_OUTPUT
          if [ "$FORCE_ALL_TESTS" == "true" ]; then
            echo "Running all tests due to previous failure"
          else
            echo "Core files changed - will run all tests"
          fi
          echo "romanceio_changed=true" >> $GITHUB_OUTPUT
          echo "romanceio_fields_changed=true" >> $GITHUB_OUTPUT
        else
          echo "core_changed=false" >> $GITHUB_OUTPUT

          # Check if romanceio-specific files changed
          if echo "$CHANGED_FILES" | grep -qE "^romanceio/"; then
            echo "romanceio_changed=true" >> $GITHUB_OUTPUT
            echo "Romanceio files changed - will run romanceio tests"
          else
            echo "romanceio_changed=false" >> $GITHUB_OUTPUT
            echo "No romanceio changes detected"
          fi

          # Check if romanceio_fields-specific files changed
          if echo "$CHANGED_FILES" | grep -qE "^romanceio_fields/"; then
            echo "romanceio_fields_changed=true" >> $GITHUB_OUTPUT
            echo "Romanceio_fields files changed - will run romanceio_fields tests"
          else
            echo "romanceio_fields_changed=false" >> $GITHUB_OUTPUT
            echo "No romanceio_fields changes detected"
          fi
        fi

    - name: Set up Python 3.11.9
      if: steps.changes.outputs.substantive_changes == 'true'
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.11.9"
        cache: 'pip'

    - name: Install dependencies
      if: steps.changes.outputs.substantive_changes == 'true'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test tag slug conversion (common)
      if: steps.changes.outputs.substantive_changes == 'true'
      run: |
        python common/test_tag_slug_conversion.py

    - name: Test bundled tag taxonomy against captured Romance.io pages
      if: steps.changes.outputs.substantive_changes == 'true'
      run: |
        python -m pytest common/test_romanceio_tag_taxonomy.py -v
        python common/check_romanceio_tag_taxonomy.py \
          --book-html-file romanceio_fields/test_data/funny_story_source.html \
          --topics-html-file romanceio_fields/test_data/romanceio_topics_page.html

    - name: Test HTML sanitizer (common)
      if: steps.changes.outputs.substantive_changes == 'true'
      run: |
        python common/test_html_sanitizer.py

    - name: Test JSON API 404 handling (common)
      if: steps.changes.outputs.substantive_changes == 'true'
      run: |
        python -m pytest common/test_orchestrator_errors.py -v
        python -m pytest common/test_detail_validation.py -v

    - name: Test vendored import (common)
      if: steps.changes.outputs.substantive_changes == 'true'
      run: |
        python -m pytest common/test_vendored_import.py -v

    - name: Test browser dependency manifests (common)
      if: steps.changes.outputs.substantive_changes == 'true'
      run: |
        python -m pytest common/test_dependency_manifests.py -v

    - name: Test conservative Flatpak browser handling (common)
      if: steps.changes.outputs.substantive_changes == 'true'
      run: |
        python -m pytest common/test_flatpak_compatibility.py -v

    - name: Test download integrity verifier (common)
      if: steps.changes.outputs.substantive_changes == 'true'
      run: |
        python -m pytest common/test_verify_sha512.py -v

    - name: Format check with Black
      if: steps.changes.outputs.substantive_changes == 'true'
      run: |
        git ls-files -z '*.py' | xargs -0 black --check --line-length=120

    - name: Lint with Pylint
      if: steps.changes.outputs.substantive_changes == 'true'
      run: |
        git ls-files -z '*.py' | xargs -0 pylint --rcfile=.pylintrc --disable=all --enable=E,F

    - name: Type check with Mypy
      if: steps.changes.outputs.substantive_changes == 'true'
      run: |
        git ls-files -z '*.py' | xargs -0 mypy --config-file=mypy.ini --follow-imports=skip

    - name: Install verified official Calibre binary
      if: steps.changes.outputs.substantive_changes == 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 xdg-utils xz-utils
        archive="$RUNNER_TEMP/calibre-$CALIBRE_CURRENT_VERSION-x86_64.txz"
        curl -fsSL \
          "https://download.calibre-ebook.com/$CALIBRE_CURRENT_VERSION/calibre-$CALIBRE_CURRENT_VERSION-x86_64.txz" \
          -o "$archive"
        python common/verify_sha512.py "$archive" "$CALIBRE_CURRENT_LINUX_SHA512"
        mkdir -p "$CALIBRE_DIRECTORY"
        tar -xJf "$archive" -C "$CALIBRE_DIRECTORY"
        echo "$CALIBRE_DIRECTORY" >> "$GITHUB_PATH"
        "$CALIBRE_DIRECTORY/calibre-debug" --version

    - name: Build plugins
      if: steps.changes.outputs.substantive_changes == 'true'
      run: |
        cd romanceio
        bash build.sh
        echo "Checking romanceio dependencies..."
        ls -la browser_vendor/shared/seleniumbase browser_vendor/current/seleniumbase
        cd ../romanceio_fields
        bash build.sh
        echo "Checking romanceio_fields dependencies..."
        ls -la browser_vendor/shared/seleniumbase browser_vendor/current/seleniumbase
        cd ..

    - name: Audit portable release ZIPs
      if: steps.changes.outputs.substantive_changes == 'true'
      run: |
        python common/test_release_zip.py \
          romanceio/Romance.io.zip \
          "romanceio_fields/Romance.io Fields.zip"
        calibre-debug -e common/test_release_zip_imports.py -- romanceio/Romance.io.zip
        calibre-debug -e common/test_release_zip_imports.py -- "romanceio_fields/Romance.io Fields.zip"

    - name: Install and verify release ZIPs
      if: steps.changes.outputs.substantive_changes == 'true'
      run: |
        calibre-customize -a romanceio/Romance.io.zip
        calibre-customize -a "romanceio_fields/Romance.io Fields.zip"
        calibre-customize -l
        calibre-debug -e common/test_installed_plugins.py

    - name: Preserve exact release ZIPs for compatibility jobs
      if: steps.changes.outputs.substantive_changes == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: release-zips
        if-no-files-found: error
        retention-days: 7
        path: |
          romanceio/Romance.io.zip
          romanceio_fields/Romance.io Fields.zip

    - name: Test romanceio plugin tag mapping
      if: steps.changes.outputs.romanceio_changed == 'true'
      env:
        PYTHONPATH: ${{ github.workspace }}/..
      run: |
        cd romanceio && calibre-debug -e test_tag_mapping.py

    - name: Test romanceio plugin tag slug conversion
      if: steps.changes.outputs.romanceio_changed == 'true'
      env:
        PYTHONPATH: ${{ github.workspace }}/..
      run: |
        cd romanceio && calibre-debug -e test_tag_slug_conversion.py

    - name: Test romanceio plugin JSON parsing
      if: steps.changes.outputs.romanceio_changed == 'true'
      env:
        PYTHONPATH: ${{ github.workspace }}/..
      run: |
        cd romanceio && calibre-debug -e test_json_parsing.py

    - name: Test romanceio plugin JSON search matching
      if: steps.changes.outputs.romanceio_changed == 'true'
      env:
        PYTHONPATH: ${{ github.workspace }}/..
      run: |
        cd romanceio && calibre-debug -e test_json_search_matching.py

    - name: Test romanceio plugin HTML search parsing
      if: steps.changes.outputs.romanceio_changed == 'true'
      env:
        PYTHONPATH: ${{ github.workspace }}/..
      run: |
        cd romanceio && calibre-debug -e test_html_search_parsing.py

    - name: Test romanceio plugin search parity (JSON vs HTML)
      if: steps.changes.outputs.romanceio_changed == 'true'
      env:
        PYTHONPATH: ${{ github.workspace }}/..
      run: |
        cd romanceio && calibre-debug -e test_search_parity.py

    - name: Test that romanceio JSON vs HTML metadata parsing matches
      if: steps.changes.outputs.romanceio_changed == 'true'
      env:
        PYTHONPATH: ${{ github.workspace }}/..
      run: |
        cd romanceio && calibre-debug -e test_json_html_parse_matches.py

    - name: Test romanceio plugin cover download
      if: steps.changes.outputs.romanceio_changed == 'true'
      env:
        PYTHONPATH: ${{ github.workspace }}/..
      run: |
        cd romanceio && calibre-debug -e test_cover_download.py

    - name: Test romanceio_fields plugin tag mapping
      if: steps.changes.outputs.romanceio_fields_changed == 'true'
      env:
        PYTHONPATH: ${{ github.workspace }}/..
      run: |
        cd romanceio_fields && calibre-debug -e test_tag_mapping.py

    - name: Test romanceio_fields rating tags
      if: steps.changes.outputs.romanceio_fields_changed == 'true'
      env:
        PYTHONPATH: ${{ github.workspace }}/..
      run: |
        cd romanceio_fields && calibre-debug -e test_rating_tags.py

    - name: Test romanceio_fields plugin tag slug conversion
      if: steps.changes.outputs.romanceio_fields_changed == 'true'
      env:
        PYTHONPATH: ${{ github.workspace }}/..
      run: |
        cd romanceio_fields && calibre-debug -e test_tag_slug_conversion.py

    - name: Test romanceio_fields plugin JSON parsing
      if: steps.changes.outputs.romanceio_fields_changed == 'true'
      env:
        PYTHONPATH: ${{ github.workspace }}/..
      run: |
        cd romanceio_fields && calibre-debug -e test_json_parsing.py

    - name: Test romanceio_fields plugin JSON search matching
      if: steps.changes.outputs.romanceio_fields_changed == 'true'
      env:
        PYTHONPATH: ${{ github.workspace }}/..
      run: |
        cd romanceio_fields && calibre-debug -e test_json_search_matching.py

    - name: Test romanceio_fields plugin HTML field parsing
      if: steps.changes.outputs.romanceio_fields_changed == 'true'
      env:
        PYTHONPATH: ${{ github.workspace }}/..
      run: |
        cd romanceio_fields && calibre-debug -e test_html_fields_parsing.py

    - name: Test romanceio_fields field mapping
      if: steps.changes.outputs.romanceio_fields_changed == 'true'
      env:
        PYTHONPATH: ${{ github.workspace }}/..
      run: |
        cd romanceio_fields && calibre-debug -e test_field_building.py

    - name: Test romanceio_fields plugin SSR HTTP field parsing
      if: steps.changes.outputs.romanceio_fields_changed == 'true'
      env:
        PYTHONPATH: ${{ github.workspace }}/..
      run: |
        cd romanceio_fields && calibre-debug -e test_http_fields_parsing.py

    - name: Test that romanceio_fields JSON vs HTML metadata parsing matches
      if: steps.changes.outputs.romanceio_fields_changed == 'true'
      env:
        PYTHONPATH: ${{ github.workspace }}/..
      run: |
        cd romanceio_fields && calibre-debug -e test_json_html_parse_matches.py

    - name: Test romanceio plugin initialization
      if: steps.changes.outputs.romanceio_changed == 'true'
      timeout-minutes: 1
      env:
        PYTHONPATH: ${{ github.workspace }}/..
      run: |
        cd romanceio && calibre-debug -e __init__.py

    - name: Test romanceio_fields plugin initialization
      if: steps.changes.outputs.romanceio_fields_changed == 'true'
      env:
        PYTHONPATH: ${{ github.workspace }}/..
      run: |
        cd romanceio_fields && calibre-debug -e __init__.py

    # Live endpoint checks are intentionally non-blocking. Each access method is
    # reported separately, but third-party availability, Cloudflare challenges,
    # and retired endpoints are not treated as repository regressions.
    # Deterministic parsing, matching, and fallback tests above remain required.
    - name: Live smoke - metadata plugin identify
      if: steps.changes.outputs.romanceio_changed == 'true'
      continue-on-error: true
      timeout-minutes: 5
      env:
        PYTHONPATH: ${{ github.workspace }}/..
      run: |
        cd romanceio && xvfb-run -a calibre-debug -e __init__.py -- --live

    - name: Live smoke - JSON search
      if: steps.changes.outputs.romanceio_fields_changed == 'true'
      continue-on-error: true
      timeout-minutes: 2
      env:
        PYTHONPATH: ${{ github.workspace }}/..
      run: |
        calibre-debug -e common/run_installed_live_smoke.py -- json-search

    - name: Live smoke - JSON book details
      if: steps.changes.outputs.romanceio_fields_changed == 'true'
      continue-on-error: true
      timeout-minutes: 2
      env:
        PYTHONPATH: ${{ github.workspace }}/..
      run: |
        calibre-debug -e common/run_installed_live_smoke.py -- json-details

    - name: Live smoke - lightweight SSR book details
      if: steps.changes.outputs.romanceio_fields_changed == 'true'
      continue-on-error: true
      timeout-minutes: 2
      env:
        PYTHONPATH: ${{ github.workspace }}/..
      run: |
        calibre-debug -e common/run_installed_live_smoke.py -- ssr-details

    - name: Live smoke - Chrome search
      if: steps.changes.outputs.romanceio_fields_changed == 'true'
      continue-on-error: true
      timeout-minutes: 2
      env:
        PYTHONPATH: ${{ github.workspace }}/..
      run: |
        xvfb-run -a calibre-debug -e common/run_installed_live_smoke.py -- chrome-search

    - name: Live smoke - Chrome book details
      if: steps.changes.outputs.romanceio_fields_changed == 'true'
      continue-on-error: true
      timeout-minutes: 2
      env:
        PYTHONPATH: ${{ github.workspace }}/..
      run: |
        xvfb-run -a calibre-debug -e common/run_installed_live_smoke.py -- chrome-details

    - name: Live smoke - default fallback path
      if: steps.changes.outputs.romanceio_fields_changed == 'true'
      continue-on-error: true
      timeout-minutes: 2
      env:
        PYTHONPATH: ${{ github.workspace }}/..
      run: |
        xvfb-run -a calibre-debug -e common/run_installed_live_smoke.py -- default

  platform-compatibility:
    name: Installed ZIP - ${{ matrix.name }}
    needs: test
    if: needs.test.outputs.substantive_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            os: ubuntu-24.04
          - name: Windows 2025
            os: windows-2025
          - name: macOS 15 (Apple Silicon)
            os: macos-15
            architecture: arm64
          - name: macOS 15 (Intel)
            os: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Set up Python 3.11.9
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.11.9"

    - name: Download the exact release ZIPs
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
      with:
        name: release-zips
        path: dist

    - name: Locate downloaded release ZIPs
      shell: pwsh
      run: |
        $romanceio = Get-ChildItem -Path dist -Recurse -Filter 'Romance.io.zip' | Select-Object -First 1
        $fields = Get-ChildItem -Path dist -Recurse -Filter 'Romance.io Fields.zip' | Select-Object -First 1
        if (-not $romanceio -or -not $fields) {
          throw 'Both release ZIPs must be present in the downloaded artifact.'
        }
        "ROMANCEIO_ZIP=$($romanceio.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "ROMANCEIO_FIELDS_ZIP=$($fields.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "CALIBRE_CONFIG_DIRECTORY=$env:RUNNER_TEMP/calibre-config" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Install verified official Calibre on Ubuntu
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 xdg-utils xz-utils
        archive="$RUNNER_TEMP/calibre-$CALIBRE_CURRENT_VERSION-x86_64.txz"
        curl -fsSL \
          "https://download.calibre-ebook.com/$CALIBRE_CURRENT_VERSION/calibre-$CALIBRE_CURRENT_VERSION-x86_64.txz" \
          -o "$archive"
        python common/verify_sha512.py "$archive" "$CALIBRE_CURRENT_LINUX_SHA512"
        mkdir -p "$RUNNER_TEMP/calibre-current"
        tar -xJf "$archive" -C "$RUNNER_TEMP/calibre-current"
        echo "$RUNNER_TEMP/calibre-current" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/calibre-current/calibre-debug" --version

    - name: Install official Calibre on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $installer = Join-Path $env:RUNNER_TEMP "calibre-$env:CALIBRE_CURRENT_VERSION.msi"
        $url = "https://download.calibre-ebook.com/$env:CALIBRE_CURRENT_VERSION/calibre-64bit-$env:CALIBRE_CURRENT_VERSION.msi"
        Invoke-WebRequest -Uri $url -OutFile $installer
        python common/verify_sha512.py $installer $env:CALIBRE_CURRENT_WINDOWS_SHA512
        $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/i', $installer, '/qn', '/norestart')
        if ($process.ExitCode -notin @(0, 3010)) {
          throw "Calibre MSI installation failed with exit code $($process.ExitCode)"
        }
        'C:\Program Files\Calibre2' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        & 'C:\Program Files\Calibre2\calibre-debug.exe' --version

    - name: Install official Calibre on macOS
      if: runner.os == 'macOS'
      run: |
        test "$(uname -m)" = "${{ matrix.architecture }}"
        curl -fsSL \
          "https://download.calibre-ebook.com/$CALIBRE_CURRENT_VERSION/calibre-$CALIBRE_CURRENT_VERSION.dmg" \
          -o "$RUNNER_TEMP/calibre.dmg"
        python common/verify_sha512.py "$RUNNER_TEMP/calibre.dmg" "$CALIBRE_CURRENT_MACOS_SHA512"
        mkdir -p "$RUNNER_TEMP/calibre-dmg"
        hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/calibre-dmg" "$RUNNER_TEMP/calibre.dmg"
        CALIBRE_APP=$(find "$RUNNER_TEMP/calibre-dmg" -maxdepth 1 -name '*.app' -print -quit)
        test -n "$CALIBRE_APP"
        ditto "$CALIBRE_APP" "$RUNNER_TEMP/calibre.app"
        hdiutil detach "$RUNNER_TEMP/calibre-dmg"
        echo "$RUNNER_TEMP/calibre.app/Contents/MacOS" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/calibre.app/Contents/MacOS/calibre-debug" --version

    - name: Audit the portable release ZIPs
      shell: pwsh
      run: python common/test_release_zip.py "$env:ROMANCEIO_ZIP" "$env:ROMANCEIO_FIELDS_ZIP"

    - name: Install both release ZIPs into isolated Calibre
      shell: pwsh
      run: |
        calibre-customize -a "$env:ROMANCEIO_ZIP"
        calibre-customize -a "$env:ROMANCEIO_FIELDS_ZIP"
        calibre-customize -l

    - name: Verify browser imports and native Calibre dependencies
      shell: pwsh
      run: |
        calibre-debug -e common/test_release_zip_imports.py -- "$env:ROMANCEIO_ZIP"
        calibre-debug -e common/test_release_zip_imports.py -- "$env:ROMANCEIO_FIELDS_ZIP"

    - name: Verify Calibre loads code from the installed ZIPs
      shell: pwsh
      run: calibre-debug -e common/test_installed_plugins.py

    # Required and deterministic: exercise the installed ZIP's real SeleniumBase
    # and undetected-Chrome launch path against a local page. The matching driver
    # is already supplied by each GitHub runner, so this performs no site or
    # driver download and cannot be affected by Romance.io or Cloudflare.
    - name: Required local Chrome launch (Linux)
      if: runner.os == 'Linux'
      timeout-minutes: 5
      run: xvfb-run -a calibre-debug -e common/run_installed_browser_smoke.py -- romanceio_fields

    - name: Required local Chrome launch
      if: runner.os != 'Linux'
      timeout-minutes: 5
      shell: pwsh
      run: calibre-debug -e common/run_installed_browser_smoke.py -- romanceio_fields

    # These exercise the real browser on every supported desktop OS, but remain
    # non-blocking because Romance.io and Cloudflare are external systems. The
    # complete set of method-specific live checks remains visible in the Ubuntu job.
    - name: Cross-platform live smoke - Chrome book details (Linux)
      if: runner.os == 'Linux' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      continue-on-error: true
      timeout-minutes: 3
      run: xvfb-run -a calibre-debug -e common/run_installed_live_smoke.py -- chrome-details

    - name: Cross-platform live smoke - Chrome book details
      if: runner.os != 'Linux' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      continue-on-error: true
      timeout-minutes: 3
      shell: pwsh
      run: calibre-debug -e common/run_installed_live_smoke.py -- chrome-details

  flatpak-compatibility:
    name: Installed ZIP - Calibre Flatpak
    needs: test
    if: needs.test.outputs.substantive_changes == 'true'
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Download the exact release ZIPs
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
      with:
        name: release-zips
        path: dist

    - name: Locate downloaded release ZIPs
      run: |
        romanceio=$(find dist -type f -name 'Romance.io.zip' -print -quit)
        fields=$(find dist -type f -name 'Romance.io Fields.zip' -print -quit)
        test -n "$romanceio" && test -n "$fields"
        romanceio=$(realpath "$romanceio")
        fields=$(realpath "$fields")
        echo "ROMANCEIO_ZIP=$romanceio" >> "$GITHUB_ENV"
        echo "ROMANCEIO_FIELDS_ZIP=$fields" >> "$GITHUB_ENV"

    - name: Install the current Calibre Flatpak
      timeout-minutes: 15
      run: |
        sudo apt-get update
        sudo apt-get install -y flatpak
        flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
        flatpak install --user --noninteractive flathub com.calibre_ebook.calibre
        flatpak info --user com.calibre_ebook.calibre
        flatpak run --filesystem="$GITHUB_WORKSPACE":ro --env=QT_QPA_PLATFORM=offscreen \
          --command=calibre-debug com.calibre_ebook.calibre --version

    - name: Install both release ZIPs inside the Flatpak sandbox
      run: |
        flatpak run --filesystem="$GITHUB_WORKSPACE":ro --env=QT_QPA_PLATFORM=offscreen \
          --command=calibre-customize com.calibre_ebook.calibre -a "$ROMANCEIO_ZIP"
        flatpak run --filesystem="$GITHUB_WORKSPACE":ro --env=QT_QPA_PLATFORM=offscreen \
          --command=calibre-customize com.calibre_ebook.calibre -a "$ROMANCEIO_FIELDS_ZIP"

    - name: Verify release imports and nested workers inside the Flatpak sandbox
      timeout-minutes: 5
      run: |
        flatpak run --filesystem="$GITHUB_WORKSPACE":ro --env=QT_QPA_PLATFORM=offscreen \
          --command=calibre-debug com.calibre_ebook.calibre \
          -e "$GITHUB_WORKSPACE/common/test_release_zip_imports.py" -- "$ROMANCEIO_ZIP"
        flatpak run --filesystem="$GITHUB_WORKSPACE":ro --env=QT_QPA_PLATFORM=offscreen \
          --command=calibre-debug com.calibre_ebook.calibre \
          -e "$GITHUB_WORKSPACE/common/test_release_zip_imports.py" -- "$ROMANCEIO_FIELDS_ZIP"
        flatpak run --filesystem="$GITHUB_WORKSPACE":ro --env=QT_QPA_PLATFORM=offscreen \
          --command=calibre-debug com.calibre_ebook.calibre \
          -e "$GITHUB_WORKSPACE/common/test_installed_plugins.py"

