name: "Diagnostic - embedded engine segfault during stalled navigation"

# Temporary: the embedded-engine timeout test intermittently segfaults in
# QtWebEngineCore on Linux and macOS with current Calibre. Repeat it, and a
# plugin-free Qt repro with and without toHtml() polling, to find the trigger.
# Results are emitted as annotations so they are readable without log access.

on:
  workflow_dispatch:
  push:
    branches: [ "diag-calibre5-windows-crash" ]

permissions:
  contents: read

env:
  CALIBRE_CURRENT_VERSION: "9.14.0"
  CALIBRE_CURRENT_LINUX_SHA512: "d1a162d472dfbc3b74946809a979197121277150efe9e2172786843573c89dab542ce2bad98164c5d788420d2b9d8caea208cfe82c5016b3db09c0ed3ef3fc37"
  CALIBRE_CURRENT_MACOS_SHA512: "b88c240f61c06ea311472419403681d914784d60f3a8e4391f65786feb49a7f2cb268dfff7b31b2e1a9e137d62efc8f3ef04d392f3ba44b56dce2199dd7708dd"
  RUNS: "30"

jobs:
  build:
    name: Build release ZIPs
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Set up Python 3.11.9
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.11.9"

    - name: Install verified official Calibre binary
      run: |
        echo "CALIBRE_CONFIG_DIRECTORY=$RUNNER_TEMP/calibre-config" >> "$GITHUB_ENV"
        echo "CALIBRE_DIRECTORY=$RUNNER_TEMP/calibre-current" >> "$GITHUB_ENV"
        sudo apt-get update
        sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 xdg-utils xz-utils
        archive="$RUNNER_TEMP/calibre-$CALIBRE_CURRENT_VERSION-x86_64.txz"
        curl -fsSL --retry 3 --retry-all-errors --connect-timeout 30 --max-time 300 \
          "https://download.calibre-ebook.com/$CALIBRE_CURRENT_VERSION/calibre-$CALIBRE_CURRENT_VERSION-x86_64.txz" \
          -o "$archive"
        python common/verify_sha512.py "$archive" "$CALIBRE_CURRENT_LINUX_SHA512"
        mkdir -p "$RUNNER_TEMP/calibre-current"
        tar -xJf "$archive" -C "$RUNNER_TEMP/calibre-current"

    - name: Build plugins
      run: |
        cd romanceio
        bash build.sh
        cd ../romanceio_fields
        bash build.sh

    - name: Upload release ZIPs
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: release-zips
        if-no-files-found: error
        retention-days: 3
        path: |
          romanceio/Romance.io.zip
          romanceio_fields/Romance.io Fields.zip

  diagnose:
    name: ${{ matrix.os }} - ${{ matrix.variant }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, macos-15, macos-15-intel ]
        # plugin: the installed plugin's lifecycle timeout test (the failing CI step)
        # poll / nopoll: plugin-free Qt load of the same stalled page
        variant: [ plugin, poll, nopoll ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Set up Python 3.11.9
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.11.9"

    - name: Report runner image
      run: |
        os_version=$(sw_vers -productVersion 2>/dev/null || lsb_release -ds)
        echo "::notice title=${{ matrix.os }} - ${{ matrix.variant }} - runner::$ImageOS image $ImageVersion; $os_version; $(uname -m)"

    - name: Download release ZIPs
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: release-zips
        path: dist

    - name: Install verified official Calibre on Ubuntu
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 xdg-utils xz-utils
        archive="$RUNNER_TEMP/calibre-$CALIBRE_CURRENT_VERSION-x86_64.txz"
        curl -fsSL --retry 3 --retry-all-errors --connect-timeout 30 --max-time 300 \
          "https://download.calibre-ebook.com/$CALIBRE_CURRENT_VERSION/calibre-$CALIBRE_CURRENT_VERSION-x86_64.txz" \
          -o "$archive"
        python common/verify_sha512.py "$archive" "$CALIBRE_CURRENT_LINUX_SHA512"
        mkdir -p "$RUNNER_TEMP/calibre-current"
        tar -xJf "$archive" -C "$RUNNER_TEMP/calibre-current"
        echo "$RUNNER_TEMP/calibre-current" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/calibre-current/calibre-debug" --version

    - name: Install verified official Calibre on macOS
      if: runner.os == 'macOS'
      run: |
        curl -fsSL --retry 3 --retry-all-errors --connect-timeout 30 --max-time 300 \
          "https://download.calibre-ebook.com/$CALIBRE_CURRENT_VERSION/calibre-$CALIBRE_CURRENT_VERSION.dmg" \
          -o "$RUNNER_TEMP/calibre.dmg"
        python common/verify_sha512.py "$RUNNER_TEMP/calibre.dmg" "$CALIBRE_CURRENT_MACOS_SHA512"
        mkdir -p "$RUNNER_TEMP/calibre-dmg"
        hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/calibre-dmg" "$RUNNER_TEMP/calibre.dmg"
        CALIBRE_APP=$(find "$RUNNER_TEMP/calibre-dmg" -maxdepth 1 -name '*.app' -print -quit)
        test -n "$CALIBRE_APP"
        ditto "$CALIBRE_APP" "$RUNNER_TEMP/calibre.app"
        hdiutil detach "$RUNNER_TEMP/calibre-dmg"
        echo "$RUNNER_TEMP/calibre.app/Contents/MacOS" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/calibre.app/Contents/MacOS/calibre-debug" --version

    - name: Install the release ZIPs into isolated Calibre
      run: |
        echo "CALIBRE_CONFIG_DIRECTORY=$RUNNER_TEMP/calibre-config" >> "$GITHUB_ENV"
        export CALIBRE_CONFIG_DIRECTORY="$RUNNER_TEMP/calibre-config"
        calibre-customize -a "$(find dist -name 'Romance.io.zip' -print -quit)"
        calibre-customize -a "$(find dist -name 'Romance.io Fields.zip' -print -quit)"

    - name: Repeat stalled navigation (${{ env.RUNS }} runs)
      env:
        VARIANT: ${{ matrix.variant }}
      run: |
        if [ "$VARIANT" = plugin ]; then
          command=(calibre-debug -e common/run_installed_browser_lifecycle.py -- timeout)
        else
          command=(calibre-debug -e common/diag_qt_stall_crash.py -- "$VARIANT")
        fi
        # Match the CI step: a fresh virtual display per run on Linux.
        if [ "$RUNNER_OS" = Linux ]; then
          command=(xvfb-run -a "${command[@]}")
        fi
        python common/diag_stall_crash_driver.py --title "${{ matrix.os }} - $VARIANT" --runs "$RUNS" -- "${command[@]}"
